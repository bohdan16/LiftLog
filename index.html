<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>LiftLog</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">WORKOUT TRACKER</div>
      <h1>LiftLog</h1>
    </div>
    <button id="installBtn" class="ghost hidden">Install</button>
  </header>

  <main>
    <section id="dashboard" class="screen active">
      <div class="hero card">
        <div>
          <span class="muted">This week</span>
          <div id="weekWorkouts" class="big">0 workouts</div>
        </div>
        <div class="heroStat">
          <span class="muted">Active kcal</span>
          <strong id="weekCalories">0</strong>
        </div>
      </div>
      <div class="grid2">
        <button class="action card" data-nav="workout"><b>Start workout</b><span>Log sets & reps</span></button>
        <button class="action card" data-nav="cardio"><b>Log cardio</b><span>Treadmill / StairMaster</span></button>
      </div>
      <div class="sectionTitle"><h2>Progress</h2><span id="volumeWeek">0 lb volume</span></div>
      <div class="card chartCard"><canvas id="volumeChart" height="180"></canvas></div>
      <div class="sectionTitle"><h2>Recent PRs</h2><button id="allHistory" class="textBtn">History</button></div>
      <div id="prs" class="stack"></div>
    </section>

    <section id="workout" class="screen">
      <div class="sectionTitle"><h2>Workout</h2><button id="newWorkout" class="textBtn">New</button></div>
      <div class="card">
        <label>Routine</label>
        <select id="routineSelect"></select>
        <div id="routineSummary" class="muted small"></div>
      </div>
      <div id="exerciseList" class="stack"></div>
      <button id="finishWorkout" class="primary full">Finish workout</button>
    </section>

    <section id="cardio" class="screen">
      <div class="sectionTitle"><h2>Cardio</h2></div>
      <div class="card form">
        <label>Activity</label>
        <select id="cardioActivity">
          <option>Treadmill</option><option>StairMaster</option><option>Bike</option><option>Other</option>
        </select>
        <label>Duration (min)</label><input id="cardioDuration" type="number" min="0" inputmode="decimal">
        <label>Calories</label><input id="cardioCalories" type="number" min="0" inputmode="decimal">
        <div id="treadmillFields">
          <label>Speed</label><input id="speed" type="number" step="0.1" min="0" inputmode="decimal">
          <label>Incline %</label><input id="incline" type="number" step="0.5" min="0" inputmode="decimal">
        </div>
        <label>Notes</label><textarea id="cardioNotes" rows="3"></textarea>
        <button id="saveCardio" class="primary full">Save cardio</button>
      </div>
      <div class="sectionTitle"><h2>Recent cardio</h2></div>
      <div id="cardioHistory" class="stack"></div>
    </section>

    <section id="history" class="screen">
      <div class="sectionTitle"><h2>History</h2></div>
      <div id="historyList" class="stack"></div>
    </section>

    <section id="settings" class="screen">
      <div class="sectionTitle"><h2>Settings</h2></div>
      <div class="card">
        <h3>Routines</h3>
        <p class="muted small">Your starter routines are preloaded. Edit the JavaScript later if you want a fully custom exercise library.</p>
        <div id="routineSettings"></div>
      </div>
      <button id="clearData" class="danger full">Delete all local data</button>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-nav="dashboard">⌂<span>Home</span></button>
    <button class="tab" data-nav="workout">＋<span>Workout</span></button>
    <button class="tab" data-nav="cardio">◒<span>Cardio</span></button>
    <button class="tab" data-nav="history">◷<span>History</span></button>
    <button class="tab" data-nav="settings">⚙<span>Settings</span></button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
